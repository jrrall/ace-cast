name: Card Forge

on:
  pull_request:
    paths:
      - 'card-forge/**'
      - '.github/workflows/card-forge*.yml'
      - 'scripts/release/**'
  push:
    branches: [main, feat/card-forge]
    paths:
      - 'card-forge/**'
      - '.github/workflows/card-forge*.yml'
      - 'scripts/release/**'

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check container inputs
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          head=HEAD
          if [ "$EVENT_NAME" = pull_request ]; then
            base=$(git merge-base "$PR_BASE" "$PR_HEAD")
            head="$PR_HEAD"
          elif [ "$EVENT_NAME" = push ] && [ -n "$BEFORE" ] && [[ ! "$BEFORE" =~ ^0+$ ]]; then
            base="$BEFORE"
          else
            # Manual runs compare the selected commit with its parent.
            base=$(git rev-parse HEAD^ 2>/dev/null || git hash-object -t tree /dev/null)
          fi
          changed_files=$(mktemp)
          git diff --name-only --no-renames -z "$base" "$head" > "$changed_files"
          changed=false
          while IFS= read -r -d '' path; do
            case "$path" in
              card-forge/forge/*|card-forge/Dockerfile|card-forge/.dockerignore|card-forge/pyproject.toml|card-forge/uv.lock|card-forge/README.md|card-forge/scripts/live_smoke.py)
                changed=true ;;
            esac
          done < "$changed_files"
          rm -f "$changed_files"
          echo "image=$changed" >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv run --frozen --extra dev pytest
        working-directory: card-forge

  image:
    needs: [test, changes]
    if: needs.changes.outputs.image == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build and check image with Docker
        run: |
          docker build -t card-forge:test card-forge
          docker run --rm card-forge:test --help
