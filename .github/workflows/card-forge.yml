name: Card Forge

on:
  pull_request:
    paths:
      - 'card-forge/**'
      - '.github/workflows/card-forge*.yml'
      - 'scripts/release/**'
  push:
    branches: [main, feat/card-forge]
    paths:
      - 'card-forge/**'
      - '.github/workflows/card-forge*.yml'
      - 'scripts/release/**'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv run --frozen --extra dev pytest
        working-directory: card-forge

  image:
    needs: test
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build and check image with Docker
        run: |
          docker build -t card-forge:test card-forge
          docker run --rm card-forge:test --help
