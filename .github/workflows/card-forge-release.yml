name: Card Forge release image

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      expected_sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag to build (for example v1.22.1)'
        type: string
        required: true

permissions:
  contents: read

# Shared by automatic and manual publication; never cancel a partial publication.
concurrency:
  group: card-forge-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      image: ${{ steps.release.outputs.image }}
    steps:
      # Keep current tooling separate: historical tags may predate these scripts.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: tooling
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - id: release
        name: Verify release and resolve exact tagged commit
        working-directory: tooling
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/resolve.mjs

  test:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv run --frozen --extra dev pytest
        working-directory: card-forge

  image:
    needs: [resolve, test]
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build, publish staging image, and smoke-test exact release source
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE: ${{ needs.resolve.outputs.image }}
          COMMIT: ${{ needs.resolve.outputs.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_ID: ${{ github.run_id }}
          ARCH: ${{ matrix.arch }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          staging="$IMAGE:build-$BUILD_ID-$ARCH"
          # OCI media types preserve the revision/version annotations on the index.
          # Disable attestations so the index contains exactly the two runnable platforms.
          docker buildx build --platform "linux/$ARCH" --provenance=false \
            --label "org.opencontainers.image.revision=$COMMIT" \
            --label "org.opencontainers.image.version=$VERSION" \
            --output "type=image,name=$staging,push=true,oci-mediatypes=true" card-forge
          docker run --rm "$staging" --help

  publish:
    needs: [resolve, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - uses: docker/setup-buildx-action@v3
      - name: Publish immutable version and SHA manifests
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
          IMAGE: ${{ needs.resolve.outputs.image }}
          COMMIT: ${{ needs.resolve.outputs.sha }}
          VERSION: ${{ needs.resolve.outputs.version }}
          BUILD_ID: ${{ github.run_id }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          node scripts/release/publish.mjs
