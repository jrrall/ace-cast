[phases]
scout = "Choose sources and open comic angles through your own worldview. Find what this character notices, misreads, wants, or fears; leave the card unwritten. In the angle, name one concrete source detail and explain why it fits your worldview."
write = "Invent distinct playable cards in your voice."
answer = "Write standalone answer cards for the supplied setup in your voice; they must also work with other setups."
critique = "Identify one predictable or vague detail per draft and propose a concrete improvement in your own voice. Do not score or declare winners."
revise = "Consider the feedback, preserve your voice and premise, and return only improvements. You may keep the original."
