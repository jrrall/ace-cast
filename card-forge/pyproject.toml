[project]
name = "card-forge"
version = "0.1.0"
description = "Standalone cron-driven multi-persona LLM agent chain that generates MadLad cards and submits them as pending to the ace-cast content API."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.51",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[project.scripts]
card-forge = "forge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
